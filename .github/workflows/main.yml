name: PlayWin Rolling Automation

on:
  schedule:
    # GitHub checks the queue every 5 minutes automatically (not exact-minute guaranteed)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwin-rolling-automation
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin SDK
        run: npm install --prefix /tmp/playwin-deps firebase-admin

      - name: Prepare automation scripts
        env:
          GENERATE_SCRIPT_B64: 
          PUBLISH_SCRIPT_B64: 
        run: |
          echo "$GENERATE_SCRIPT_B64" | base64 -d > /tmp/generate-results.js
          echo "$PUBLISH_SCRIPT_B64" | base64 -d > /tmp/publish-due-results.js

      - name: Publish all due results
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: NODE_PATH="/tmp/playwin-deps/node_modules" node /tmp/publish-due-results.js

      - name: Refill queue to 55 future results per game
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: NODE_PATH="/tmp/playwin-deps/node_modules" node /tmp/generate-results.js
