<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d2c">
<title>PlayWin – User Results</title>
<style>
:root{
 --bg:#080d2c;--panel:#111735;--line:#303858;--text:#f2f4ff;
 --muted:#b7bfdc;--green:#126b50;--orange:#a85d13;--purple:#68449b;
 --pink:#e71955;--teal:#08bf83;--gold:#ffbf42;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif;min-height:100vh}
header{background:linear-gradient(115deg,#80d9f4,#b4c8ff);color:#08133a;text-align:center;padding:25px 16px 22px}
.logo{font-size:28px;font-weight:900}
header h1{font-size:30px;margin:8px 0 3px}
header p{font-size:15px;font-weight:800;color:#31566b;margin:0}
.marquee{background:#28a9e4;color:#071c45;font-weight:800;white-space:nowrap;overflow:hidden;padding:11px 0;font-size:14px}
.marquee span{display:inline-block;padding-left:100%;animation:move 18s linear infinite}
@keyframes move{to{transform:translateX(-100%)}}
main{width:min(100%,760px);margin:auto;padding:22px 14px 36px}
.menu{display:grid;gap:13px}
.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:15px;padding:21px 20px;color:white;font-size:19px;font-weight:800;min-height:70px;cursor:pointer}
.m2{background:linear-gradient(110deg,#f21c58,#b60043)}
.m3{background:linear-gradient(110deg,#08c77d,#0788bb)}
.mt{background:linear-gradient(110deg,#ff9f00,#b65b00)}
.chev{font-size:29px}
.menu-label{text-align:center;color:#aeb8d7;letter-spacing:4px;font-size:12px;font-weight:900;margin:13px 0 0}
.chart-btn{background:#171d40!important;border:1px solid #454969!important;font-size:16px!important;min-height:58px!important}
.page{display:none}
.page.active{display:block}
.back{border:1px solid #566080;background:#1a2346;color:white;border-radius:9px;padding:10px 14px;font-weight:700;margin-bottom:15px;cursor:pointer}
.page-title{text-align:center;font-size:20px;letter-spacing:1px;margin:2px 0 16px}
.panel{background:var(--panel);border:1px solid #272f55;border-radius:14px;padding:14px;margin:12px 0}
.panel-title{text-align:center;font-size:16px;font-weight:800;margin:2px 0 13px}
.meta{color:var(--muted);font-size:12px;text-align:center;margin-top:11px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.grid2d{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.num{min-width:0;text-align:center;padding:9px 1px;border-radius:5px;font-size:clamp(8px,2.5vw,13px);font-weight:900;letter-spacing:-.3px;color:#fff;overflow:hidden}
.num.g{background:var(--green);border:1px solid #239b76}
.num.o{background:var(--orange);border:1px solid #d98a32}
.num.p{background:var(--purple);border:1px solid #9675c8}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three-card{background:#0b1430;border:1px solid #168b68;border-radius:10px;text-align:center;padding:16px 4px}
.three-card b{display:block;color:#aeb8d7;font-size:12px;margin-bottom:8px}
.three-card strong{font-size:clamp(21px,6vw,29px);color:#ffcf45}
.titli-result{font-size:28px;font-weight:900;text-align:center;padding:18px 5px}
.date-panel label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px}.date-panel input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#101a34;color:#fff;font:inherit;color-scheme:dark}.history-item{border-bottom:1px solid var(--line);padding:12px 2px}
.history-item:last-child{border:0}
.history-name{font-weight:800;font-size:13px;margin-bottom:7px}
.history-date{font-size:11px;color:var(--muted);margin-top:7px}
.history-2d{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.history-2d span{font-size:clamp(7px,2.1vw,11px);font-weight:800;text-align:center;padding:5px 0;border-radius:4px;background:#1a2748}
.history-3d{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.history-3d span{text-align:center;background:#0b1430;border-radius:6px;padding:7px 2px;font-size:12px}
.history-3d b{color:#aeb8d7}
.history-titli{text-align:center;font-weight:800;padding:5px}
footer{text-align:center;color:#9ba7c8;padding:28px 12px 18px;font-size:12px}
@media(min-width:560px){main{padding-left:22px;padding-right:22px}.grid2d{gap:7px}.num{padding:12px 2px}}

/* Result view: fit result grids to mobile width without horizontal overflow. */
html, body { width:100%; max-width:100%; overflow-x:hidden; }
main { width:100%; max-width:760px; padding:12px 10px 20px; }
#resultPage { width:100%; min-width:0; }
.page-title { font-size:18px; margin:0 0 10px; }
.panel { width:100%; min-width:0; padding:10px; margin:8px 0; border-radius:12px; }
.panel-title { font-size:14px; margin:1px 0 9px; }
.date-panel { padding:9px 10px; }
.date-panel label { font-size:10px; margin-bottom:5px; }
.date-panel input { padding:8px 9px; font-size:14px; }
.grid2d { width:100%; grid-template-columns:repeat(10,minmax(0,1fr)); gap:3px; }
.num { min-width:0; padding:7px 0; font-size:clamp(10px,2.9vw,15px); line-height:1.15; letter-spacing:-.35px; border-radius:4px; }
.three { width:100%; gap:6px; }
.three-card { min-width:0; padding:13px 3px; border-radius:9px; }
.three-card b { font-size:11px; margin-bottom:6px; }
.three-card strong { font-size:clamp(23px,7vw,34px); line-height:1.1; }
.titli-result { font-size:clamp(26px,7vw,36px); padding:12px 4px; line-height:1.2; }
.meta { font-size:11px; margin-top:7px; }
.empty { padding:15px 6px; font-size:13px; }
.history-item { padding:9px 1px; }
.history-name { font-size:12px; margin-bottom:5px; }
.history-date { font-size:10px; margin-top:5px; }
.history-2d { width:100%; grid-template-columns:repeat(10,minmax(0,1fr)); gap:2px; }
.history-2d span { min-width:0; padding:5px 0; font-size:clamp(9px,2.5vw,13px); line-height:1.1; }
.history-3d { gap:4px; }
.history-3d span { min-width:0; padding:7px 2px; font-size:12px; }
.history-titli { font-size:16px; }
.back { padding:8px 12px; margin-bottom:9px; font-size:13px; }
@media (max-width:380px) {
 main { padding-left:7px; padding-right:7px; }
 .panel { padding:8px; }
 .grid2d, .history-2d { gap:2px; }
 .num { font-size:clamp(9px,2.7vw,11px); padding:6px 0; }
 .history-2d span { font-size:clamp(8px,2.3vw,10px); }
 .three-card { padding:11px 2px; }
}
@media (min-width:560px) {
 main { padding-left:18px; padding-right:18px; }
 .num { font-size:15px; }
}


/* Slightly smaller home screen controls, preserving the existing PlayWin branding. */
body.home-view {
  min-height:100svh;
  display:flex;
  flex-direction:column;
}
body.home-view header { padding:12px 12px 9px; }
body.home-view .logo { font-size:23px; }
body.home-view header h1 { font-size:26px; margin:3px 0 2px; }
body.home-view header p { font-size:13px; }
body.home-view .marquee { padding:6px 0; font-size:11px; }
body.home-view main {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:12px 14px 10px;
}
body.home-view .menu { gap:7px; }
body.home-view .menu button {
  min-height:49px;
  padding:10px 14px;
  border-radius:11px;
  font-size:16px;
}
body.home-view .chev { font-size:22px; }
body.home-view .menu-label {
  margin:6px 0 0;
  font-size:10px;
  letter-spacing:3px;
}
body.home-view .chart-btn {
  min-height:41px!important;
  font-size:14px!important;
}
body.home-view footer { padding:8px 7px 6px; font-size:10px; }

@media (max-width:600px) and (max-height:760px) {
  body.home-view header { padding:8px 10px 6px; }
  body.home-view .logo { font-size:20px; }
  body.home-view header h1 { font-size:23px; margin:2px 0; }
  body.home-view header p { font-size:11px; }
  body.home-view .marquee { padding:4px 0; font-size:10px; }
  body.home-view main { padding:7px 12px 6px; }
  body.home-view .menu { gap:5px; }
  body.home-view .menu button {
    min-height:42px;
    padding:8px 12px;
    font-size:15px;
    border-radius:9px;
  }
  body.home-view .chev { font-size:19px; }
  body.home-view .menu-label { margin:3px 0 0; font-size:9px; }
  body.home-view .chart-btn { min-height:35px!important; font-size:12px!important; }
  body.home-view footer { padding:4px 5px 3px; font-size:9px; }
}


/* Larger result values and draw timestamps on the result pages. */
#latestResult .grid2d .num {
  font-size:clamp(14px,3.8vw,18px);
  padding:9px 0;
  line-height:1.2;
  letter-spacing:-.2px;
}
#history .history-2d span {
  font-size:clamp(12px,3.2vw,16px);
  padding:7px 0;
  line-height:1.2;
}
#latestDate {
  font-size:16px;
  font-weight:800;
  line-height:1.35;
  margin-top:11px;
}
#history .history-date {
  font-size:14px;
  font-weight:700;
  line-height:1.35;
  margin-top:8px;
}
#latestResult .three-card strong {
  font-size:clamp(29px,8vw,38px);
  line-height:1.15;
}
#latestResult .three-card b { font-size:14px; }
#latestResult .titli-result {
  font-size:clamp(34px,9vw,44px);
  padding:15px 5px;
}
@media(max-width:380px) {
  #latestResult .grid2d .num { font-size:clamp(12px,3.5vw,15px); padding:8px 0; }
  #history .history-2d span { font-size:clamp(10px,2.9vw,13px); padding:6px 0; }
  #latestDate { font-size:14px; }
  #history .history-date { font-size:12px; }
}


.logo{display:flex;justify-content:center;align-items:center}
.logo img{display:block;width:116px;height:116px;max-width:34vw;max-height:34vw;object-fit:contain;margin:0 auto}
@media(max-width:600px) and (max-height:760px){.logo img{width:96px;height:96px}}
\n</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyAg6p3xd8PziGjl07kOI6i2sqcIwtZV260",
 authDomain:"mahadev-d7e20.firebaseapp.com",
 databaseURL:"https://mahadev-d7e20-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"mahadev-d7e20",
 storageBucket:"mahadev-d7e20.firebasestorage.app",
 messagingSenderId:"237989025786",
 appId:"1:237989025786:web:869d018fcd171a13a8b643"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const ROOT="playwinV2";
let records=[];
let realRecords=[];
let currentRecords=[];
let demoRecords=[];
let activeType="2D Fourth";
let selectedDate="";

const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[ch]));

function dateText(value){
 if(value===undefined||value===null||value==="")return "";
 let d=typeof value==="number"?new Date(value):new Date(value);
 if(isNaN(d.getTime()))return "";
 return d.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true});
}
function drawTimestamp(r){
 const value=r.time;
 if(typeof value==="number")return value;
 const parsed=Date.parse(value||"");
 return Number.isNaN(parsed)?0:parsed;
}
function sortTime(r){
 return drawTimestamp(r);
}
// Keep today and the previous three India-calendar days (4 dates total).
function fourDayCutoff(){
 const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 const get=k=>Number(parts.find(p=>p.type===k).value);
 return Date.UTC(get("year"),get("month")-1,get("day")-3,-5,-30);
}
function withinFourDays(r){
 const t=drawTimestamp(r)||Number(r.publishedAt||0);
 return t>=fourDayCutoff();
}
function drawIdentity(r){
 // Deduplicate by scheduled/draw time, NOT by publishedAt (which changes on every republish).
 const stamp=drawTimestamp(r);
 return r.type+"|"+(stamp||String(r.time||"").trim());
}
function istDateKey(value){
 const d=value instanceof Date?value:new Date(value);
 if(isNaN(d.getTime()))return "";
 const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);
 const get=k=>p.find(x=>x.type===k).value;
 return get("year")+"-"+get("month")+"-"+get("day");
}
function todayIST(){return istDateKey(new Date());}
function cutoffDateKey(){const d=new Date(Date.now()-3*86400000);return istDateKey(d);}
function latestOf(type){return records.filter(r=>r.type===type&&istDateKey(r.time||r.publishedAt)===selectedDate).sort((a,b)=>sortTime(b)-sortTime(a))[0]||null;}

function render2D(result,multipliers=[]){
 if(!Array.isArray(result)||result.length!==30){
  return '<div class="empty">2D result is not available in the expected 30-number format.</div>';
 }
 return '<div class="grid2d">'+result.map((n,i)=>{
  const color=i<10?"g":i<20?"o":"p";
  const mult=Array.isArray(multipliers)?multipliers[i]||"":"";
  return '<div class="num '+color+'">'+esc(n)+(mult?'<small style="display:block;font-size:9px;color:#ffe0a8;margin-top:3px">'+esc(mult)+'</small>':'')+'</div>';
 }).join("")+'</div>';
}
function render3D(result){
 if(!result||typeof result!=="object")return '<div class="empty">3D result not available.</div>';
 return '<div class="three">'+["A","B","C"].map(k=>
  '<div class="three-card"><b>RESULT '+k+'</b><strong>'+esc(result[k]||"---")+'</strong></div>'
 ).join("")+'</div>';
}
function renderTitli(result,multiplier=""){
 if(!result||typeof result!=="object")return '<div class="empty">Titli Goda result not available.</div>';
 return '<div class="titli-result">'+esc(result.emoji||"🦋")+' '+esc(result.name||"")+(multiplier?'<div style="font-size:15px;color:#ffe0a8;margin-top:7px">'+esc(multiplier)+'</div>':'')+'</div>';
}
function resultMarkup(type,result,record={}){
 if(type==="2D Fourth")return render2D(result,record.multipliers||[]);
 if(type==="3D Result")return render3D(result);
 if(type==="Titli Goda")return renderTitli(result,record.multiplier||"");
 return '<div class="empty">Result unavailable.</div>';
}
function historyMarkup(r){
 let body="";
 if(r.type==="2D Fourth"){
  if(!Array.isArray(r.result)||r.result.length!==30)return "";
  body='<div class="history-2d">'+r.result.map((n,i)=>{
   const mult=Array.isArray(r.multipliers)?r.multipliers[i]||"":"";
   return '<span style="color:'+(i<10?'#63e8ba':i<20?'#ffc17a':'#d1baff')+'">'+esc(n)+(mult?'<small style="display:block;font-size:8px;color:#ffe0a8">'+esc(mult)+'</small>':'')+'</span>';
  }).join("")+'</div>';
 }else if(r.type==="3D Result"){
  body='<div class="history-3d">'+["A","B","C"].map(k=>'<span><b>'+k+'</b> '+esc(r.result?.[k]||"---")+'</span>').join("")+'</div>';
 }else if(r.type==="Titli Goda"){
  body='<div class="history-titli">'+esc(r.result?.emoji||"🦋")+' '+esc(r.result?.name||"")+(r.multiplier?'<div style="font-size:11px;color:#ffe0a8;margin-top:4px">'+esc(r.multiplier)+'</div>':'')+'</div>';
 }
 return '<div class="history-item"><div class="history-name">'+esc(r.type)+(r.demo?' <span style="color:#ffcf45;font-size:10px">• DEMO</span>':'')+'</div>'+body+'<div class="history-date">'+dateText(r.time??r.publishedAt)+'</div></div>';
}
function renderPage(){
 const current=latestOf(activeType);
 document.getElementById("pageTitle").textContent=activeType==="2D Fourth"?"2D FOURTH RESULT":activeType.toUpperCase()+" RESULT";
 document.getElementById("latestResult").innerHTML=current?((current.demo?'<div style="text-align:center;color:#ffcf45;font-size:11px;font-weight:900;margin-bottom:8px">DEMO HISTORY — NOT AN OFFICIAL RESULT</div>':'')+resultMarkup(activeType,current.result,current)):'<div class="empty">No published result yet.</div>';
 document.getElementById("latestDate").textContent=current?dateText(current.time??current.publishedAt):"";
 const dateInput=document.getElementById("historyDate");
 dateInput.max=todayIST(); dateInput.min=cutoffDateKey();
 if(!selectedDate)selectedDate=todayIST();
 dateInput.value=selectedDate;
 const dayRecords=records.filter(r=>r.type===activeType&&istDateKey(r.time||r.publishedAt)===selectedDate).sort((a,b)=>sortTime(b)-sortTime(a));
 const previous=dayRecords.filter(r=>!current||drawIdentity(r)!==drawIdentity(current));
 document.getElementById("history").innerHTML=previous.length?previous.map(historyMarkup).join(""):'<div class="empty">इस तारीख के बाकी परिणाम उपलब्ध नहीं हैं।</div>';
}
function changeHistoryDate(value){
 if(!value)return;
 selectedDate=value;
 renderPage();
}
function openPage(type){
 activeType=type;
 selectedDate=todayIST();
 document.getElementById("homeMenu").style.display="none";
 document.getElementById("resultPage").classList.add("active");
 renderPage();
 window.scrollTo({top:0,behavior:"smooth"});
}
function goHome(){
 document.getElementById("resultPage").classList.remove("active");
 document.getElementById("homeMenu").style.display="grid";
 window.scrollTo({top:0,behavior:"smooth"});
}

function refreshRecords(){
 const merged=[...realRecords,...currentRecords,...demoRecords]
  .filter(r=>r&&typeof r==="object"&&["2D Fourth","3D Result","Titli Goda"].includes(r.type)&&withinFourDays(r));
 // One result per game + actual draw timestamp. Admin history always wins over demo.
 const unique=new Map();
 for(const r of merged){
  const key=drawIdentity(r);
  const old=unique.get(key);
  if(!old || (old.demo && !r.demo) ||
     (old.demo===r.demo && Number(r.publishedAt||0)>Number(old.publishedAt||0))){
   unique.set(key,r);
  }
 }
 records=[...unique.values()].sort((a,b)=>sortTime(b)-sortTime(a));
 if(document.getElementById("resultPage").classList.contains("active"))renderPage();
}
db.ref(ROOT+"/history").on("value",snapshot=>{
 const data=snapshot.val()||{};
 realRecords=Object.entries(data).map(([firebaseKey,value])=>({...value,firebaseKey,demo:false}));
 refreshRecords();
},error=>{
 document.getElementById("latestResult").innerHTML='<div class="empty">Could not load published results: '+esc(error.message)+'</div>';
});
// Latest published records are also read from current as a fallback.
// history remains the source for date-wise archive; current ensures the latest
// published result can appear even if the archive listener is temporarily stale.
db.ref(ROOT+"/current").on("value",snapshot=>{
  const data=snapshot.val()||{};
  currentRecords=Object.entries(data).map(([key,value])=>({...value,firebaseKey:"current_"+key,demo:false}));
  refreshRecords();
},error=>{
  document.getElementById("latestResult").innerHTML='<div class="empty">Could not load current results: '+esc(error.message)+'</div>';
});

db.ref(ROOT+"/demoHistory").on("value",snapshot=>{
 const data=snapshot.val()||{};
 demoRecords=Object.entries(data).map(([firebaseKey,value])=>({...value,firebaseKey,demo:true}));
 refreshRecords();
},error=>{
 document.getElementById("latestResult").innerHTML='<div class="empty">Could not load demo history: '+esc(error.message)+'</div>';
});
</script>
</body>
</html>
